name: Feature Request
description: Suggest a change or addition to RayTraceAntiEntityESP
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do that the plugin doesn't currently support
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see added or changed
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've tried
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Server setup, other plugins involved, or anything else relevant
    validations:
      required: false
