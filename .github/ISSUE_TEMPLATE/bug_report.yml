name: Bug Report
description: Report a problem with RayTraceAntiEntityESP
labels: ["bug"]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Exact version or build (from /version RayTraceAntiEntityESP, or the jar filename)
      placeholder: "e.g. 1.4.2"
    validations:
      required: true

  - type: input
    id: server-software
    attributes:
      label: Server software and Minecraft version
      description: e.g. Purpur 1.21.11, Paper 1.21.11, Folia 1.21.11
      placeholder: "e.g. Purpur 1.21.11 build 2566"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "e.g. Java 25"
    validations:
      required: true

  - type: textarea
    id: other-plugins
    attributes:
      label: Other plugins installed
      description: List other plugins running on the server, especially any related to holograms, NPCs, teams/tablist (TAB, LuckPerms, PlaceholderAPI, FancyHolograms, DecentHolograms, Citizens, etc). If the bug only happens with a specific plugin combination, note that.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config.yml section
      description: Paste the relevant parts of your config.yml, especially anti_entities / anti_mode if related to ESP behavior
      render: yaml
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console log / error / stack trace
      description: Full stack trace if there is one. Use a paste site (gist.github.com, mclo.gs) for long logs and link it here.
      render: shell
    validations:
      required: false
