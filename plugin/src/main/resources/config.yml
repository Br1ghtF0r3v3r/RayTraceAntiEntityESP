# RayTrace Anti Entity ESP Configuration File

#Config version, don't touch. Bumped automatically when the plugin adds/changes
#keys; your old file gets backed up and merged into the new template.
config_version: 6

#-----------------------------------------------
# CHECKING
#-----------------------------------------------
checking:
  #Turn the whole ESP check on/off
  enabled: true

  #Ticks between check passes (1 tick = 50ms). Leave at 1 if you're using stagger_groups.
  period_ticks: 1

  #Spreads entities across N groups, one group checked per tick, so you're not
  #raytracing everyone every single tick. Higher = less CPU per tick, more ticks
  #before a hidden entity's state updates. Pushed up from the default 3 for speed.
  stagger_groups: 6

  #Inside this distance, entities are always shown, walls or not. 0 to disable.
  #Left on — it's a cheap distance check, skips the raytrace entirely when it fires.
  distance_override: 10

  #Fudge factor added to entity hitboxes for the raytrace. 0 to disable.
  bounding_box_extra_value: 0

  #How many vertex layers get sampled per entity (min 2). More = more accurate,
  #more CPU. Set to the floor for max speed — fewer samples per entity per check.
  vertices_layers: 3

async:
  # Run raycast visibility checks off the main thread using chunk snapshots.
  enabled: true
  # Worker threads for async raycasts.
  threads: 2
  # How long (in ticks) a cached chunk snapshot stays valid before being refreshed.
  chunk_snapshot_ttl_ticks: 200

#-----------------------------------------------
# PERSPECTIVE CHECKING
#-----------------------------------------------
perspective_checking:
  #Also raytrace from where a third-person camera would sit. Roughly triples
  #the raytrace per entity (eye + two 3rd-person angles). Turned off here for
  #speed — the trade-off is a player who pops into 3rd person can peek an
  #entity through a wall that the 1st-person check alone would've kept hidden.
  enabled: true

  #How far back the simulated 3rd-person camera sits (blocks). Unused while
  #perspective_checking is off.
  distances_from_head: 4

#-----------------------------------------------
# DISPLAY NAME
#-----------------------------------------------
display_name:
  #Puts a fake nametag over hidden entities so they're not just invisible
  enabled: true

  #How often the nametag repositions/refreshes (ticks), independent of
  #checking.period_ticks. Raised from the default 1 — nametags don't need to
  #be as crisp as the visibility check itself, and this is one more thing off
  #the hot path every tick.
  period_ticks: 1

  #Ticks to extrapolate the nametag ahead based on recent velocity. Doesn't
  #cost meaningfully more CPU either way — left at default.
  lookahead_ticks: 3

  #Vertical nudge for the nametag height (blocks)
  offset_y: 0

#-----------------------------------------------
# DEBUG
#-----------------------------------------------
debug:
  #Draws debug markers at the raytrace vertices and forces every check
  #synchronous. Never enable this if you actually care about performance.
  enabled: false

#-----------------------------------------------
# ANTI ENTITIES
#-----------------------------------------------
#Which entity types get ESP protection. Use the names from:
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
#Keep this list as short as possible — every extra type is more entities
#in the tracking query and more raytrace per tick.
anti_entities:
  - player

#whitelist = only the listed types get checked
#blacklist = everything gets checked except the listed types
anti_mode: whitelist

#-----------------------------------------------
# BLACKLISTED WORLD
#-----------------------------------------------
#Worlds where checking is skipped entirely, based on the viewer's current world.
#Empty list = runs everywhere. If you've got worlds where ESP doesn't matter
#(minigame lobbies, creative/build worlds, etc.), list them here — it's a free
#skip of the entire check for every player standing in them.
blacklisted_world: []