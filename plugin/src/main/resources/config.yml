# RayTrace Anti Entity ESP Configuration File

#Don't touch this. The plugin bumps it when keys change and merges your old file into the new one (backup is kept).
config_version: 6

#-----------------------------------------------
# CHECKING
#-----------------------------------------------
checking:
  #Turns the whole ESP check on or off
  enabled: true

  #Ticks between checks (1 tick = 50ms). Keep it at 1 if you use stagger_groups. Range 1-1200
  period_ticks: 1

  #Splits entities into N groups and checks one group per tick instead of everyone every tick.
  #Higher = less CPU, but hidden entities take longer to update. Range 1-64
  stagger_groups: 6

  #Entities closer than this are always shown. 0 turns it off. Range 0-256
  distance_override: 10

  #Extra size added to the hitbox. Range 0-4
  #Only used by the debug markers right now, the real check ignores it
  bounding_box_extra_value: 0

  #How many sample layers per entity. Range 2-7
  #Only used by the debug markers right now, the real check ignores it
  vertices_layers: 3

async:
  #Run the raycasts off the main thread using chunk snapshots
  enabled: true
  #Worker threads for the raycasts. Range 1-16
  threads: 2
  #Ticks a chunk snapshot stays valid. Changing a block in the chunk refreshes it early. Range 1-72000
  chunk_snapshot_ttl_ticks: 200

#-----------------------------------------------
# PERSPECTIVE CHECKING
#-----------------------------------------------
perspective_checking:
  #Also checks from where a third person camera would be. Costs about 3x the raytraces.
  #If you turn it off, someone in third person can see through walls the first person check would block
  enabled: true

  #How far behind the player the fake camera sits, in blocks. Range 0-32
  distances_from_head: 4

#-----------------------------------------------
# DISPLAY NAME
#-----------------------------------------------
display_name:
  #Shows a fake nametag over hidden entities so they don't just vanish
  enabled: true

  #Ticks between nametag updates. Higher = less work per tick. Range 1-200
  period_ticks: 1

  #How many ticks ahead the nametag is moved, based on the entity's speed. Range 0-20
  lookahead_ticks: 3

  #Moves the nametag up or down, in blocks. Range -10 to 10
  offset_y: 0

#-----------------------------------------------
# UPDATE CHECKER
#-----------------------------------------------
update_checker:
  #Checks GitHub once on startup for a newer release and tells admins when they join.
  #Set to false if you don't want the plugin touching the internet
  enabled: true

#-----------------------------------------------
# DEBUG
#-----------------------------------------------
debug:
  #Draws markers at the raytrace points and forces every check to run on the main thread.
  #Leave it off on a live server
  enabled: false

#-----------------------------------------------
# ANTI ENTITIES
#-----------------------------------------------
#Entity types that get protected. Names come from:
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
#A misspelled name gets ignored (you'll see a warning), so that entity stays unprotected.
#Keep the list short, every extra type costs more raytraces.
anti_entities:
  - player

#whitelist = only the listed types are checked
#blacklist = everything is checked except the listed types
#Anything else falls back to whitelist
anti_mode: whitelist

#-----------------------------------------------
# BLACKLISTED WORLD
#-----------------------------------------------
#Worlds where checking is skipped, based on the world the viewer is in.
#Empty = runs everywhere. Good for lobbies, creative worlds and so on
blacklisted_world: []