plugins {
    id "java"
    id "com.gradleup.shadow"
    id "xyz.jpenilla.run-paper"
}
evaluationDependsOn(':nms-26_1')
evaluationDependsOn(':nms-26_2')
evaluationDependsOn(':nms-26_3')

dependencies {
    implementation "org.bstats:bstats-bukkit:${bstatsBukkitVersion}"
    compileOnly "me.clip:placeholderapi:${placeholderApiVersion}"
    compileOnly("com.github.retrooper:packetevents-spigot:${packetEventsVersion}") {
        exclude group: 'io.netty'
    }
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    compileOnly "io.netty:netty-transport:${nettyTransportVersion}"
    implementation project(':nms-api')
    shadow project(path: ':nms-1_21', configuration: 'runtimeElements')
}
tasks {
    shadowJar {
        archiveBaseName.set(rootProject.name)
        archiveClassifier.set("")
        archiveVersion.set("")
        mergeServiceFiles()
        configurations.set([project.configurations.shadow, project.configurations.runtimeClasspath] as Set)
        dependsOn project(':nms-26_1').tasks.named('compileJava')
        dependsOn project(':nms-26_2').tasks.named('compileJava')
        dependsOn project(':nms-26_3').tasks.named('compileJava')
        from(project(':nms-26_1').tasks.named('compileJava').flatMap { it.destinationDirectory })
        from(project(':nms-26_2').tasks.named('compileJava').flatMap { it.destinationDirectory })
        from(project(':nms-26_3').tasks.named('compileJava').flatMap { it.destinationDirectory })
        relocate("org.bstats", rootProject.group.toString() + ".libs.bstats")
    }
    jar {
        enabled = false
    }
    runServer {
        def runRoot = rootProject.file(".run")
        if (!runRoot.isDirectory()) {
            throw new GradleException("No '.run' folder found in project root")
        }
        def matches = runRoot.listFiles()?.findAll {
            it.isDirectory() && it.name.contains(".run")
        } ?: []
        if (matches.isEmpty()) {
            throw new GradleException("No folder containing '.run' found in ${runRoot}")
        }
        if (matches.size() > 1) {
            throw new GradleException("Multiple '.run' folders found in ${runRoot}: ${matches*.name}: only one should be active at a time")
        }
        def targetDir = matches[0]
        def versionMatcher = targetDir.name =~ /^(\d+(?:\.\d+)+)(?:\s|$)/
        if (!versionMatcher.find()) {
            throw new GradleException("Could not determine Minecraft version from run folder '${targetDir.name}'")
        }
        runDirectory(targetDir)
        minecraftVersion(versionMatcher.group(1))
        serverJar(new File(targetDir, "server.jar"))
        systemProperty("com.mojang.eula.agree", true)
    }
}
processResources {
    def props = [
            name: rootProject.name,
            version: rootProject.version,
            description: rootProject.description,
            main: main,
            apiVersion: apiVersion,
            author: author,
    ]
    inputs.properties props
    filesMatching('plugin.yml') { expand props }
    filesMatching('build.properties') { expand props }
    filteringCharset = 'UTF-8'
}
