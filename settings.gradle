pluginManagement {
    repositories {
        gradlePluginPortal()
    }
    plugins {
        id 'io.papermc.paperweight.userdev' version providers.gradleProperty('paperweightUserdevPluginVersion').get()
        id 'com.gradleup.shadow' version providers.gradleProperty('shadowPluginVersion').get()
        id 'xyz.jpenilla.run-paper' version providers.gradleProperty('runPaperPluginVersion').get()
        id 'org.gradle.toolchains.foojay-resolver-convention' version providers.gradleProperty('foojayResolverPluginVersion').get()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = name

include 'nms-api', 'nms-1_21', 'nms-26_1', 'nms-26_2', 'nms-26_3', 'plugin'
