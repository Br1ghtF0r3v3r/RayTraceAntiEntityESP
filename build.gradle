plugins {
    id 'io.papermc.paperweight.userdev' apply false
}

def java21 = (java21 as int)
def java25 = (java25 as int)

subprojects {
    apply plugin: 'java'

    def javaVersion = project.path.startsWith(':nms-26_') ? java25 : java21

    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://repo.codemc.io/repository/maven-releases/" }
        maven { url = "https://repo.codemc.io/repository/maven-snapshots/" }
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
        maven { url = "https://repo.extendedclip.com/releases/" }
        maven { url = "https://maven.respark.dev/releases" }
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)

        if (JavaVersion.current() < JavaVersion.toVersion(javaVersion)) {
            toolchain.languageVersion = JavaLanguageVersion.of(javaVersion as String)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (javaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release = javaVersion
        }
    }
}
